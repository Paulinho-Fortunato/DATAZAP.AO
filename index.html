<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <!-- SEO Otimizado -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ganhe 20GB grátis na Unitel, Africell ou Movicel! Promoção exclusiva DATAZAP.AO para Angola. Recarga imediata de dados móveis.">
    <meta name="keywords" content="20GB grátis, Unitel, Africell, Movicel, internet grátis Angola, recarga dados, promoções Angola, DATAZAP">
    <meta name="author" content="DATAZAP.AO">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#F68B1F">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://datazap.ao/">
    <meta property="og:title" content="DATAZAP.AO | Ganhe 20GB Grátis em Angola">
    <meta property="og:description" content="Promoção exclusiva: 20GB grátis para clientes Unitel, Africell e Movicel. Participe agora!">
    <meta property="og:image" content="https://datazap.ao/assets/og-image.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DATAZAP.AO | 20GB Grátis">
    <meta name="twitter:description" content="Ganhe 20GB grátis na sua operadora favorita em Angola!">

    <!-- Schema Markup -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DATAZAP.AO",
        "url": "https://datazap.ao",
        "description": "Plataforma de promoções de dados móveis em Angola",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://datazap.ao/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <title>DATAZAP.AO | Ganhe 20GB Grátis - Unitel, Africell, Movicel</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap-icons.css">

    <!-- RichInfo Push -->
    <script type="module" src="https://richinfo.co/richpartners/push/js/rp-cl-ob.js?pubid=1015704&siteid=400261&niche=33" async data-cfasync="false"></script>

    <!-- PRELOAD DO SCRIPT DO MONETAG PRIMEIRO -->
    <link rel="preload" href="https://api.monetag.com/init.js" as="script">
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="script.js" as="script">

    <!-- CARREGAR SCRIPT DO MONETAG ANTES DE TUDO -->
    <script type="text/javascript">
        window.monetag = window.monetag || { queue: [] };
        monetag.cmd = monetag.cmd || [];
        (function() {
            var mt = document.createElement('script');
            mt.type = 'text/javascript';
            mt.async = true;
            mt.src = 'https://api.monetag.com/init.js#pubid=1015704'; // COLOQUE SEU PUBID AQUI
            var s = document.getElementsByTagName('script')[0];
            s.parentNode.insertBefore(mt, s);
        })();
    </script>
</head>
<body>
    <div class="bg-animated" id="bgAnimated"></div>

    <!-- NATIVE ADS - TOPO (ACIMA DO CARD PRINCIPAL) -->
    <div class="container-custom" style="max-width: 540px; margin: 0 auto; padding: 10px 16px 0;">
        <div id="monetag-native-top" class="native-ad-container" style="min-height: 120px; margin-bottom: 10px;"></div>
    </div>

    <!-- NATIVE ADS - LATERAL (APENAS PARA TELAS GRANDES) -->
    <div class="d-none d-md-block" style="position: fixed; top: 20%; left: 20px; width: 300px; z-index: 9998;">
        <div id="monetag-native-sidebar-left" class="native-ad-container" style="min-height: 250px;"></div>
    </div>
    <div class="d-none d-md-block" style="position: fixed; top: 20%; right: 20px; width: 300px; z-index: 9998;">
        <div id="monetag-native-sidebar-right" class="native-ad-container" style="min-height: 250px;"></div>
    </div>

    <div class="container-custom">
        <div class="card-main" id="mainCard" style="margin-bottom: 30px;">
            <!-- Header -->
            <div class="logo-header">
                <i class="bi bi-gift-fill"></i>
            </div>
            <h1 class="main-title text-center">Ganhe 20GB Grátis</h1>
            <p class="subtitle text-center">Promoção exclusiva para clientes Unitel, Africell e Movicel</p>

            <!-- Countdown -->
            <div class="countdown-box">
                <div class="countdown-label">
                    <i class="bi bi-clock-fill me-2"></i>Oferta expira em
                </div>
                <div class="countdown-timer" id="countdown">07:00</div>
            </div>

            <!-- Live Indicator -->
            <div class="text-center">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span><strong id="liveCount">170</strong> pessoas resgatando agora</span>
                </div>
            </div>

            <!-- Step Indicator -->
            <div class="step-indicator" id="stepIndicator">
                <div class="step-dot active" data-step="1"></div>
                <div class="step-dot" data-step="2"></div>
                <div class="step-dot" data-step="3"></div>
            </div>

            <!-- NATIVE ADS - DENTRO DO CARD (ANTES DO CONTEÚDO) -->
            <div id="monetag-native-inside-top" class="native-ad-container" style="min-height: 100px; margin-bottom: 20px;"></div>

            <!-- Dynamic Content Area -->
            <div id="contentArea">
                <!-- Content will be injected here -->
            </div>

            <!-- NATIVE ADS - DENTRO DO CARD (DEPOIS DO CONTEÚDO) -->
            <div id="monetag-native-inside-bottom" class="native-ad-container" style="min-height: 100px; margin-top: 20px;"></div>

            <!-- NATIVE ADS - ABAIXO DO CONTEÚDO -->
            <div id="monetag-native-bottom" class="native-ad-container" style="min-height: 120px; margin-top: 20px;"></div>
        </div>

        <!-- NATIVE ADS - RODAPÉ -->
        <div id="monetag-native-footer" class="native-ad-container" style="min-height: 120px; margin-bottom: 10px;"></div>

        <p class="text-center mt-4 mb-0" style="color: var(--text-secondary); font-size: 0.875rem; align-self: center;">
            <i class="bi bi-shield-check me-2"></i>Promoção oficial DATAZAP.AO &copy; 2026
        </p>
    </div>

    <!-- INTERSTITIAL ADS - CONTAINERS ADICIONAIS -->
    <div id="interstitial-ad-1" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999;"></div>
    <div id="interstitial-ad-2" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999;"></div>

    <!-- IN-PAGE PUSH - CONTAINER -->
    <div id="monetag-inpagepush-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>

    <script src="script.js"></script>

    <!-- SCRIPT DO MONETAG OTIMIZADO -->
    <script type="text/javascript">
        // AGUARDAR O CARREGAMENTO COMPLETO DO MONETAG
        monetag.cmd.push(function() {
            // NATIVE ADS - TOPO
            monetag.native({
                container: '#monetag-native-top',
                format: 'native',
                template: 'carousel',
                limit: 3,
                refresh: 30 // ATUALIZAR A CADA 30 SEGUNDOS
            });

            // NATIVE ADS - LATERAIS (TELAS GRANDES)
            monetag.native({
                container: '#monetag-native-sidebar-left',
                format: 'native',
                template: 'list',
                limit: 1,
                refresh: 60
            });
            monetag.native({
                container: '#monetag-native-sidebar-right',
                format: 'native',
                template: 'list',
                limit: 1,
                refresh: 60
            });

            // NATIVE ADS - DENTRO DO CARD (TOPO)
            monetag.native({
                container: '#monetag-native-inside-top',
                format: 'native',
                template: 'small',
                limit: 1,
                refresh: 45
            });

            // NATIVE ADS - DENTRO DO CARD (RODAPÉ)
            monetag.native({
                container: '#monetag-native-inside-bottom',
                format: 'native',
                template: 'small',
                limit: 1,
                refresh: 45
            });

            // NATIVE ADS - ABAIXO DO CARD
            monetag.native({
                container: '#monetag-native-bottom',
                format: 'native',
                template: 'list',
                limit: 2,
                refresh: 30
            });

            // NATIVE ADS - RODAPÉ
            monetag.native({
                container: '#monetag-native-footer',
                format: 'native',
                template: 'carousel',
                limit: 3,
                refresh: 30
            });

            // IN-PAGE PUSH - MAIS IMPRESSÕES
            monetag.inpagePush({
                position: 'bottom-right',
                container: '#monetag-inpagepush-container',
                delay: 1500, // EXIBIR APÓS 1,5 SEGUNDOS
                maxNotifications: 5, // AUMENTAR O NÚMERO DE NOTIFICAÇÕES
                refresh: 20, // ATUALIZAR A CADA 20 SEGUNDOS
                theme: 'dark' // COMPATÍVEL COM O DESIGN DO SITE
            });

            // POPUNDER - CONFIGURAÇÃO OTIMIZADA
            monetag.popunder({
                delay: 2000, // EXIBIR APÓS 2 SEGUNDOS
                maxPopunders: 3, // ATÉ 3 POPUNDERS POR SESSÃO
                interval: 60, // DEPOIS DE 60 SEGUNDOS PODE EXIBIR OUTRO
                trigger: 'scroll', // TAMBÉM DISPARAR AO ROLAR A TELA
                scrollThreshold: 30 // QUANDO O USUÁRIO ROLAR 30% DA TELA
            });

            // INTERSTITIAL ADS - CONFIGURAÇÃO
            monetag.interstitial({
                container: '#interstitial-ad-1',
                trigger: 'click', // DISPARAR AO CLICAR EM QUALQUER LUGAR
                delay: 3000,
                closeButton: true,
                showOncePerSession: false // PERMITIR MAIS DE UMA VEZ
            });
            monetag.interstitial({
                container: '#interstitial-ad-2',
                trigger: 'time', // DISPARAR APÓS ALGUNS SEGUNDOS
                delay: 10000, // EXIBIR APÓS 10 SEGUNDOS
                closeButton: true
            });
        });
    </script>
</body>
</html>
